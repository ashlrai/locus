# Example binding — copy to ~/.locus/bindings/acme.toml and edit.
# Never put raw secrets here; use env: refs. phm: refs parse but fail closed
# until a scoped Phantom bridge exists (docs/credential-compatibility.md).

[binding]
id = "bnd_acme"
alias = "acme"
tenant = "acme-corp"
description = "Acme client engagement"

[binding.policy]
default = "allow"
require_approval = ["*.delete*", "*.drop*", "vercel.deploy.prod"]
# Firm mode: these tools need two externally authenticated identities. That
# authority is not shipped, so today they stay blocked (docs/policy.md).
dual_control = ["*.delete*", "vercel.deploy.prod"]
# dual_control_all_approvals = true
max_ttl = "8h"
parallel_sessions = 4             # parsed, not enforced yet (docs/policy.md)

[[binding.providers]]
provider = "supabase"
account = "acme-prod"
credential_ref = "phm:SUPABASE_ACME"
scope = { project_ref = "YOUR_PROJECT_REF", read_only = true }

[[binding.providers]]
provider = "github"
account = "acme-corp"
credential_ref = "phm:GH_TOKEN_ACME"
scope = { orgs = ["acme-corp"], repos = ["acme-corp/*"] }
# Optional: spawn an upstream MCP worker for this provider when pinned
# (its tools need a supervised launch, `locus mcp --supervised`; docs/workers.md).
# upstream = { command = "npx", args = ["-y", "@modelcontextprotocol/server-github"], resolve_secrets = true }

[[binding.providers]]
provider = "vercel"
account = "acme-team"
credential_ref = "phm:VERCEL_TOKEN_ACME"
scope = { team_id = "team_xxx", projects = ["acme-web"], env = ["preview"] }
