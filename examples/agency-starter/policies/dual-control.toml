# Snippet: dual-control policy for firm-mode client write bindings.
# Merge under [binding.policy] in the client binding file.
#
# Advisory review path (never execution authority):
#   locus approve grant <id> --as engineer
#   locus approve grant <id> --as partner

default = "allow"
max_ttl = "8h"
parallel_sessions = 4

require_approval = [
  "*.delete*",
  "*.drop*",
  "vercel.deploy.prod",
]

# Tools that require two externally authenticated identities.
dual_control = [
  "*.delete*",
  "vercel.deploy.prod",
]

# Uncomment to require dual-control on every require_approval match:
# dual_control_all_approvals = true

# Optional structured rules (first match wins for allow/deny/require_approval):
# [[rules]]
# match = "supabase.execute_sql"
# action = "require_approval"
# [[rules]]
# match = "vercel.deploy.prod"
# action = "dual_control"
