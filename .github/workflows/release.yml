name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p locus-cli -p locus-mcp

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          OUT="dist"
          mkdir -p "$OUT"
          BIN_DIR="target/${TARGET}/release"
          # Strip where available (macOS/Linux)
          if command -v strip >/dev/null 2>&1; then
            strip "${BIN_DIR}/locus" || true
            strip "${BIN_DIR}/locus-mcp" || true
          fi
          STAGE="locus-${TARGET}"
          mkdir -p "${OUT}/${STAGE}"
          cp "${BIN_DIR}/locus" "${OUT}/${STAGE}/"
          cp "${BIN_DIR}/locus-mcp" "${OUT}/${STAGE}/"
          cp README.md LICENSE "${OUT}/${STAGE}/" 2>/dev/null || true
          (
            cd "$OUT"
            tar -czf "locus-${TARGET}.tar.gz" "${STAGE}"
          )
          echo "Packed locus-${TARGET}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locus-${{ matrix.target }}
          path: dist/locus-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name 'locus-*.tar.gz' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
