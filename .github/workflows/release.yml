name: Release

on:
  push:
    tags:
      - "v*"
    # Auto-release: a merge that changes the Cargo workspace version (the
    # version PR) releases itself. Any other Cargo.toml edit finds the tag and
    # release already there and does nothing.
    branches: [main]
    paths:
      - "Cargo.toml"
  # Heal a release that failed after the version landed: run on main.
  workflow_dispatch:
  # Dry run: a PR that changes this workflow builds, packages and checksums
  # the Linux archive and verifies the assets, but never publishes a release.
  pull_request:
    paths:
      - ".github/workflows/release.yml"

# A PR dry run cancels its superseded run; tag pushes never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    # Decides what this run releases and whether the release is owed at all.
    # Release gate: the sha must have a green CI run. A manual v* tag needs the
    # full suite from a workflow_dispatch run; an automatic release (main push
    # or dispatch on main) accepts the merge queue's CI Gate run on that exact
    # sha, which is the check that let the version PR merge.
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide the tag and require green CI on this sha
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          CI_WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          # PR dry runs never publish, so they need no evidence.
          if [ "$EVENT" = "pull_request" ]; then
            echo "PR dry run: evidence not required"
            { echo "run=true"; echo "tag=dry-run"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          node scripts/release-version.mjs check
          version="$(node scripts/release-version.mjs version)"
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            node scripts/release-version.mjs check --tag "$REF_NAME"
            tag="$REF_NAME"; events="workflow_dispatch"
          else
            [ "$REF" = "refs/heads/main" ] || { echo "::error::automatic releases run from main only (ref is ${REF})"; exit 1; }
            tag="v${version}"; events="merge_group workflow_dispatch"
            # Owed only while the release or either npm package is missing.
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 \
               && npm view "locus-cli@${version}" version >/dev/null 2>&1 \
               && npm view "@ashlrai/locus-mcp@${version}" version >/dev/null 2>&1; then
              echo "${tag} is already released and on npm; nothing to do."
              { echo "run=false"; echo "tag=${tag}"; } >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          n=0
          for ev in $events; do
            c="$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?event=${ev}&head_sha=${SHA}&status=success&per_page=1" --jq '.total_count')"
            n=$((n + ${c:-0}))
          done
          if [ "$n" -lt 1 ]; then
            echo "::error::No successful ${CI_WORKFLOW} run (${events}) on ${SHA}. Run 'gh workflow run ${CI_WORKFLOW} --ref <this ref>', wait for green, then re-run this workflow."
            exit 1
          fi
          echo "CI green on ${SHA} (${n} run(s)); releasing ${tag}"
          { echo "run=true"; echo "tag=${tag}"; } >> "$GITHUB_OUTPUT"

  build:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    # The PR dry run builds Linux only: the macOS job becomes a no-op on
    # ubuntu so it never queues behind the shared macOS runners.
    name: Build ${{ matrix.name }}${{ github.event_name == 'pull_request' && matrix.release_only && ' (release only)' || '' }}
    runs-on: ${{ github.event_name == 'pull_request' && matrix.release_only && 'ubuntu-latest' || matrix.os }}
    env:
      SKIP_BUILD: ${{ github.event_name == 'pull_request' && matrix.release_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build in one job: Apple Silicon natively and
          # Intel cross-compiled (macos-13 is scarce), in one cargo
          # invocation. Two jobs meant two waits for the shared macOS slots,
          # which other repositories' CI keeps busy for hours at a time.
          - name: apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            os: macos-latest
            release_only: true
          # Same steps and the same loops as the macOS job, so the PR dry run
          # exercises the code path a tag release takes.
          - name: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - name: Checkout
        if: env.SKIP_BUILD != 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: env.SKIP_BUILD != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        if: env.SKIP_BUILD != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.name }}

      - name: Build release binaries
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          args=()
          for t in $TARGETS; do args+=(--target "$t"); done
          cargo build --release "${args[@]}" -p locus-cli -p locus-mcp

      - name: Package artifacts
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          OUT="dist"
          mkdir -p "$OUT"
          for TARGET in $TARGETS; do
            BIN_DIR="target/${TARGET}/release"
            # Strip where available (macOS/Linux)
            if command -v strip >/dev/null 2>&1; then
              strip "${BIN_DIR}/locus" || true
              strip "${BIN_DIR}/locus-mcp" || true
            fi
            STAGE="locus-${TARGET}"
            mkdir -p "${OUT}/${STAGE}"
            cp "${BIN_DIR}/locus" "${OUT}/${STAGE}/"
            cp "${BIN_DIR}/locus-mcp" "${OUT}/${STAGE}/"
            cp README.md LICENSE "${OUT}/${STAGE}/" 2>/dev/null || true
            (
              cd "$OUT"
              tar -czf "locus-${TARGET}.tar.gz" "${STAGE}"
              # Checksum of the final archive bytes, in `sha256sum -c` format.
              # Integrity metadata only: not a signature or publisher attestation.
              shasum -a 256 "locus-${TARGET}.tar.gz" > "locus-${TARGET}.tar.gz.sha256"
              shasum -a 256 -c "locus-${TARGET}.tar.gz.sha256"
            )
            echo "Packed locus-${TARGET}.tar.gz"
          done

      - name: Upload artifact
        if: env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: locus-${{ matrix.name }}
          path: |
            dist/locus-*.tar.gz
            dist/locus-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name 'locus-*.tar.gz' -o -name 'locus-*.tar.gz.sha256' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets/

      # Every archive ships with a sidecar that names exactly that archive and
      # matches its bytes; a missing, stray or foreign sidecar fails the release.
      - name: Verify release checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(locus-*.tar.gz)
          sidecars=(locus-*.tar.gz.sha256)
          [ "${#archives[@]}" -gt 0 ] || { echo "no release archives" >&2; exit 1; }
          [ "${#archives[@]}" -eq "${#sidecars[@]}" ] || { echo "archive/sidecar count mismatch" >&2; exit 1; }
          for asset in "${archives[@]}"; do
            [ -f "${asset}.sha256" ] || { echo "missing ${asset}.sha256" >&2; exit 1; }
            sha256sum "$asset" | cmp -s - "${asset}.sha256" || { echo "${asset}.sha256 does not describe ${asset}" >&2; exit 1; }
          done
          sha256sum -c "${sidecars[@]}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-manifest

      # Canonical catalog of the built-in adapter set for this tag, attached
      # UNSIGNED. CI does not sign on purpose: no registry signing secret is
      # provisioned. Operators sign locally and distribute the signed manifest
      # out of band:
      #   locus adapter registry export --sign --key <keyfile> --out locus-adapters-<tag>.json
      # Consumers verify with:
      #   locus adapter verify-manifest locus-adapters-<tag>.json
      # See docs/registry-trust.md.
      - name: Export adapter registry manifest (unsigned)
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cargo run --release --locked -p locus-cli -- adapter registry export \
            --out "release-assets/locus-adapters-${TAG}.json"

      # TODO(registry-signing): once a LOCUS_REGISTRY_SIGNING_KEY repo secret
      # exists (base64 or 64-hex ed25519 seed; NOT yet provisioned — do not
      # invent one), replace the step above with a signed export:
      #
      #   - name: Export adapter registry manifest (signed)
      #     env:
      #       LOCUS_REGISTRY_SIGNING_KEY: ${{ secrets.LOCUS_REGISTRY_SIGNING_KEY }}
      #     shell: bash
      #     run: |
      #       set -euo pipefail
      #       cargo run --release --locked -p locus-cli -- adapter registry export --sign \
      #         --key-id root \
      #         --out "release-assets/locus-adapters-${GITHUB_REF_NAME}.json"
      #
      # and publish the matching public key (locus adapter trust add --id root
      # --ed25519-pub <b64>) in the release notes / docs/registry-trust.md.

      - name: Create release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Creates the tag at this sha when an automatic release has none yet.
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm publish through trusted publishing (OIDC): no NPM_TOKEN. Runs for a v*
  # tag push or an automatic release from main, after the GitHub Release
  # exists, because the npm wrappers download that release's assets on first
  # run. Never on a PR (the dry run).
  # Register on npmjs.com for each package: owner ashlrai, repo locus,
  # workflow release.yml, no environment.
  npm-publish:
    name: Publish npm packages (${{ matrix.dir }})
    needs: [plan, release]
    if: github.event_name != 'pull_request'
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dir: [npm, npm-mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Upgrade npm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          npm --version
          if [ -n "${NPM_TOKEN:-}" ]; then echo "::error::token-based npm auth must not be configured"; exit 1; fi

      - name: Check the tag matches the package version
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          [ "v${version}" = "${TAG}" ] || { echo "tag ${TAG} does not match ${name}@${version}" >&2; exit 1; }
          echo "NPM_PKG=${name}@${version}" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          if npm view "${NPM_PKG}" version >/dev/null 2>&1; then
            echo "${NPM_PKG} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
