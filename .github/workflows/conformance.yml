# Isolation + hub contract conformance (beyond unit CI).
# INV suite, MCP protocol, hub-smoke, and full e2e shell pack.
name: Conformance

# Runs after merge on main, with the scheduled full suite (6 AM and 6 PM ET),
# and on dispatch. PRs and the merge queue still wait on CI Gate only.
on:
  push:
    branches: [main]
  schedule:
    - cron: "57 10 * * *"
    - cron: "57 22 * * *"
  workflow_dispatch:

# Read-only token: no step needs write access.
permissions:
  contents: read

# A burst of pushes to one ref shares a group and the newer run cancels the
# older. Schedule and dispatch keep a per-run group so a main push cannot
# cancel them.
concurrency:
  group: conformance-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  conformance:
    name: invariants · mcp · hub-smoke · e2e
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # e2e builds release binaries and runs the full shell pack
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Docs-only PRs skip the heavy steps below, but this job still runs and
      # reports, so the required check never strands. Pushes, dispatches and
      # any PR touching a non-docs path run everything. If the diff cannot be
      # read, everything runs (fail open to the full suite).
      - name: Classify changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && files="$(git diff --name-only "$BASE...$HEAD")" && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -Evq '^(docs/[^/]+\.md|docs/assets/.*|[A-Za-z_-]+\.md|LICENSE)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full conformance suite: $code"

      - name: Install Rust toolchain
        if: steps.scope.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache cargo
        if: steps.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: conformance

      - name: Install cargo-nextest
        if: steps.scope.outputs.code == 'true'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest

      - name: Install jq
        if: steps.scope.outputs.code == 'true'
        # ubuntu-latest ships jq; apt only runs if an image ever drops it.
        run: command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

      - name: Invariant suite (locus-core)
        if: steps.scope.outputs.code == 'true'
        run: cargo nextest run -p locus-core --test invariants --locked --no-fail-fast

      - name: MCP protocol + transport (locus-mcp)
        if: steps.scope.outputs.code == 'true'
        run: cargo nextest run -p locus-mcp --locked --no-fail-fast

      - name: Hub contract smoke
        if: steps.scope.outputs.code == 'true'
        run: ./scripts/hub-smoke.sh

      - name: End-to-end shell pack
        if: steps.scope.outputs.code == 'true'
        run: ./scripts/e2e.sh
        timeout-minutes: 60
