name: CI

# PR and merge_group run one fast required check (CI Gate): fmt, clippy,
# the distribution wrapper and crypto policy checks, the sandbox tests and
# a pinned diff secret scan. The full suite (nextest, doctests, release
# build, Phantom contract, recipes, MSRV, conformance, coverage, macOS npm
# smoke) runs at 6 AM and 6 PM ET on main and on workflow_dispatch; a red
# scheduled run files a P0 FIX-MAIN issue (fix-main.yml). Pushes to main no
# longer run CI: the merge queue already ran the gate on the merged tree.
# The phantom+locus integration lives in integration.yml.
on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  merge_group:
  schedule:
    # Daily full suite at 06:00 ET (10:00 UTC).
    - cron: "0 10 * * *"
  workflow_dispatch:

# Cancel superseded PR runs; never cancel queue or scheduled runs. Schedule and
# dispatch runs get a per-run group so a release-evidence dispatch is never
# cancelled by a later queued run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for every job: read the repo, nothing else. No job in this
# workflow writes to the repo, PRs, packages or releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast:
    name: fmt · clippy · security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Required with a SHA pin: the action can no longer read it from the ref.
          toolchain: stable
          components: rustfmt, clippy

      # PR and queue runs restore the cache saved by the daily main run and
      # skip the save, so they do not pay the post-job upload.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Runs beside fast so Node and Ruby setup stay off the Clippy critical path.
  wrappers:
    name: wrappers · crypto policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"

      # Includes the crypto policy check (Tier-1).
      - name: Validate distribution wrappers
        run: |
          node --check npm/install.js
          node --check npm/bin/locus.js
          node --check npm-mcp/install.js
          node --check npm-mcp/bin/locus-mcp.js
          node --test npm/test
          node --test scripts/check-crypto.test.mjs
          node scripts/check-crypto.mjs
          ruby -c integrations/homebrew/Formula/locus.rb

  # Tier-1 worker sandbox tests: pre-merge whenever the PR touches the sandbox,
  # locus-core, the lockfile or CI, and on every daily and dispatch run. The
  # job always runs and reports success, so the gate keeps exact keys.
  sandbox:
    name: sandbox tests (Tier-1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            files="$(git diff --name-only "$base" "$HEAD_SHA")"
            if ! grep -Eq '^(crates/locus-core/|\.cargo/|\.github/workflows/ci\.yml$)|(^|/)Cargo\.(toml|lock)$|(^|/)rust-toolchain' <<<"$files"; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"; echo "sandbox tests: $run"

      - name: Install Rust toolchain
        if: steps.sel.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo
        if: steps.sel.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

      - name: Sandbox tests
        if: steps.sel.outputs.run == 'true'
        run: |
          set -euo pipefail
          cargo test -p locus-core --lib --locked sandbox 2>&1 | tee sandbox.log
          n="$(grep -Eo '^test result: ok\. [0-9]+ passed' sandbox.log | awk '{s+=$4} END {print s+0}')"
          echo "sandbox tests passed: $n"
          # Tier-1 guard: a rename that drops every sandbox test must fail, not pass empty.
          [ "$n" -gt 0 ] || { echo "::error::no sandbox tests selected"; exit 1; }

  check:
    name: fmt · clippy · test · release build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Validate distribution wrappers
        run: |
          node --check npm/install.js
          node --check npm/bin/locus.js
          node --check npm-mcp/install.js
          node --check npm-mcp/bin/locus-mcp.js
          node --test npm/test
          node --test scripts/check-crypto.test.mjs
          node scripts/check-crypto.mjs
          ruby -c integrations/homebrew/Formula/locus.rb

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest: every test in its own process, parallel across binaries.
      # Doctests are not run by nextest, so they stay on cargo test --doc.
      # Scheduled and dispatch runs always run the complete suite.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      - name: Doctests
        run: cargo test --workspace --doc

      - name: Release build
        run: cargo build --workspace --release

      # The release guide requires this shell suite in addition to Rust tests.
      # It uses disposable Locus homes, synthetic fixtures and loopback servers.
      # Its summary reports optional feature skips; green is not zero-skips proof.
      - name: Release end-to-end gate
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash cargo python3 curl git jq; do
            command -v "$tool" >/dev/null || { echo "missing e2e prerequisite: $tool" >&2; exit 1; }
          done
          node --test scripts/ci/e2e-release-gate.test.mjs
          bash scripts/e2e.sh

      # npm wrappers at the Cargo version and packable; release locus-mcp keeps
      # the MCP surface Phantom's companion smoke drives. About 1s.
      - name: Release and Phantom contract
        run: node scripts/ci/phantom-contract.mjs

      - name: Recipes (examples/recipes against the release build)
        run: node --test examples/recipes

  # Declared MSRV (workspace.package.rust-version). cargo check only, on the
  # schedule and on dispatch. Not one of the required checks. RUSTUP_TOOLCHAIN overrides
  # rust-toolchain.toml, which pins stable for in-repo development. RUSTFLAGS
  # is cleared so dependency warnings on the older compiler are not promoted
  # to errors.
  msrv:
    name: msrv (rustc 1.89)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.89.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-1.89.0

      - name: Check
        run: cargo +1.89.0 check --workspace --locked

  secret-scan:
    # Security floor: diff-only secret scan on every event, pinned Gitleaks
    # 8.30.0 (sha256-verified). No path filter and no if-condition; the gate
    # fails unless this job succeeds (skipped or cancelled fails closed).
    name: Secret scan (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Scan the commits this event adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$(git merge-base "$PR_BASE" "$HEAD_SHA")" ;;
            merge_group) base="$MG_BASE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="${HEAD_SHA}~1"; fi
          # A PR must not allowlist its own leak: ignore any repo-supplied config.
          rm -f .gitleaks.toml .gitleaksignore
          echo "scanning ${base}..${HEAD_SHA}"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="${base}..${HEAD_SHA}" --redact --no-banner --max-target-megabytes 5 --timeout 120

  secret-shape:
    # Security floor: pinned scrub.pl (sha256 5aa902ab) over the added lines of
    # the candidate diff, on every event. No if and no paths filter; the gate
    # fails closed unless this job succeeds.
    name: Secret-shape scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan candidate diff (fail closed)
        env:
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          if [ -z "${BASE_SHA}" ]; then BASE_SHA="$(git rev-parse "${HEAD_SHA}^1")"; fi
          base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          git diff --no-color --no-ext-diff "${base}" "${HEAD_SHA}" > "${RUNNER_TEMP}/candidate.diff"
          perl .github/tests/secret-shape/scrub.pl --check --allow-fixtures < "${RUNNER_TEMP}/candidate.diff"

  # The one required check. Every event needs the fast job and the secret
  # scan; scheduled and dispatch runs also need the full suite and MSRV.
  # Any needed job that is not success (failure, cancelled or skipped) fails.
  gate:
    name: CI Gate
    if: always()
    needs: [fast, wrappers, sandbox, secret-scan, check, msrv, secret-shape]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Exact dependency keys: a missing or extra job fails closed.
          printf '%s' "$NEEDS" | jq -e --argjson exp "[\"check\", \"fast\", \"msrv\", \"sandbox\", \"secret-scan\", \"secret-shape\", \"wrappers\"]" '(keys | sort) == $exp' > /dev/null || { echo "::error::gate dependency inventory changed"; exit 1; }
          full=false
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then full=true; fi
          bad="$(printf '%s' "$NEEDS" | jq -r --argjson full "$full" 'to_entries[] | select(.value.result != "success") | select(($full | not) and (.key == "check" or .key == "msrv") and .value.result == "skipped" | not) | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then echo "::error::CI Gate: $bad"; exit 1; fi
          echo "CI Gate passed ($EVENT)"

  fixup-queue:
    # Daily red run -> READY FIXUP lines for the router queue (fix-forward owner:
    # ci-efficiency). One line per failed job from the needs context only: no
    # logs or env, read-only token, passed through the pinned scrub.pl.
    name: Daily fixup queue
    needs: [fast, wrappers, sandbox, check, msrv, secret-scan, secret-shape, gate]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout scrubber
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/tests/secret-shape/scrub.pl
          sparse-checkout-cone-mode: false
      - name: Build fixup-queue.txt
        env:
          NEEDS: ${{ toJSON(needs) }}
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          sha7="${GITHUB_SHA:0:7}"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s' "$NEEDS" | jq -r --arg sha7 "$sha7" --arg run "$run" --arg repo "locus" --arg up "$(echo locus | tr a-z- A-Z-)" '
            [to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | to_entries[] |
            "- READY RQ-FIXUP-\($up)-\($sha7)-\(.key + 1) (P0, pool=any, repo=\($repo), lead=CI-Efficiency, owner=ci-efficiency, job=\(.value.key), result=\(.value.value.result), run=\($run), sha=\($sha7)): daily full suite job \(.value.key) concluded \(.value.value.result); first error is in the run'"'"'s failed step."' > raw.txt
          perl .github/tests/secret-shape/scrub.pl < raw.txt > fixup-queue.txt
          echo "fixup_lines=$(wc -l < fixup-queue.txt)"
          cat fixup-queue.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fixup queue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locus-fixup-queue
          path: fixup-queue.txt
          if-no-files-found: error
          retention-days: 7
