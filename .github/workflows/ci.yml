name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded PR runs; never cancel main/master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test · release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Validate distribution wrappers
        run: |
          node --check npm/install.js
          node --check npm/bin/locus.js
          node --check npm-mcp/install.js
          node --check npm-mcp/bin/locus-mcp.js
          node --test npm/test/*.test.js
          ruby -c integrations/homebrew/Formula/locus.rb

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest: every test in its own process, parallel across binaries.
      # Doctests are not run by nextest, so they stay on cargo test --doc.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      - name: Doctests
        run: cargo test --workspace --doc

      - name: Release build
        run: cargo build --workspace --release

      - name: Recipes (examples/recipes against the release build)
        run: node --test examples/recipes
