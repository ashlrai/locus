name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # So the required checks report in the merge queue once the ruleset enables
  # it. The phantom+locus integration lives in integration.yml.
  merge_group:

# Cancel superseded PR runs; never cancel main/master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for every job: read the repo, nothing else. No job in this
# workflow writes to the repo, PRs, packages or releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test · release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Validate distribution wrappers
        run: |
          node --check npm/install.js
          node --check npm/bin/locus.js
          node --check npm-mcp/install.js
          node --check npm-mcp/bin/locus-mcp.js
          node --test npm/test
          node --test scripts/check-crypto.test.mjs
          node scripts/check-crypto.mjs
          ruby -c integrations/homebrew/Formula/locus.rb

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest: every test in its own process, parallel across binaries.
      # Doctests are not run by nextest, so they stay on cargo test --doc.
      # PRs: only crates the diff touches plus their reverse deps (nextest
      # rdeps filterset); manifest/lockfile/toolchain/CI changes select all().
      # Pushes to main always run the complete suite.
      - name: Select affected tests
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            fs="$(bash scripts/ci/affected-filterset.sh "$BASE" "$HEAD" || echo 'all()')"
          else
            fs='all()'
          fi
          echo "filterset=$fs" >> "$GITHUB_OUTPUT"
          echo "nextest filterset: $fs"

      - name: Test
        if: steps.affected.outputs.filterset != 'none()'
        run: cargo nextest run --workspace --no-fail-fast -E "${{ steps.affected.outputs.filterset }}"

      - name: Doctests
        run: cargo test --workspace --doc

      - name: Release build
        run: cargo build --workspace --release

      # npm wrappers at the Cargo version and packable; release locus-mcp keeps
      # the MCP surface Phantom's companion smoke drives. About 1s.
      - name: Release and Phantom contract
        run: node scripts/ci/phantom-contract.mjs

      - name: Recipes (examples/recipes against the release build)
        run: node --test examples/recipes

  # Declared MSRV (workspace.package.rust-version). cargo check only.
  # Pull requests run it when a Cargo.toml or Cargo.lock changes. Every other
  # event runs it, because a .rs change breaks the MSRV as often as a manifest
  # change. Not one of the required checks. RUSTUP_TOOLCHAIN overrides
  # rust-toolchain.toml, which pins stable for in-repo development. RUSTFLAGS
  # is cleared so dependency warnings on the older compiler are not promoted
  # to errors.
  msrv:
    name: msrv (rustc 1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTFLAGS: ""
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to run
        id: manifests
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run=false
          case "$EVENT" in
            pull_request)
              files=""
              # Default checkout depth is 1. Fetch the base commit and use a
              # two-dot diff: `git diff A B` only needs those two trees. A
              # three-dot diff needs a merge base, which this depth does not have.
              if [ -z "$BASE" ]; then
                run=true
              elif ! git fetch --no-tags --depth=1 origin "$BASE"; then
                run=true
              elif ! files="$(git diff --name-only "$BASE" HEAD)"; then
                run=true
              elif printf '%s\n' "$files" | grep -Eq '(^|/)Cargo\.toml$|(^|/)Cargo\.lock$'; then
                run=true
              fi
              ;;
            push|merge_group|schedule|workflow_dispatch)
              run=true
              ;;
            *)
              run=true
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "msrv cargo check: $run ($EVENT)"

      - name: Install Rust toolchain
        if: steps.manifests.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.89.0

      - name: Cache cargo
        if: steps.manifests.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-1.89.0

      - name: Check
        if: steps.manifests.outputs.run == 'true'
        run: cargo +1.89.0 check --workspace --locked
