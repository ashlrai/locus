# Built-in Locus provider adapters and capabilities.
# Source of truth for docs / hub discovery. Implementations live under
# crates/locus-core/src/adapters/. See docs/adapter-sdk.md.
#
# Schema: schema/adapter-manifest.schema.json
# CLI:    locus adapter list | verify [--require-signed] | trust list|add
#
# Optional per-provider signature fields:
#   signature = "ed25519:<base64>"       # preferred
#   signature = "hmac-sha256:<hex>"      # backcompat stand-in
#   signed_by = "key-id"                 # trust-store key id
# Trust (merged; env wins on same id):
#   $LOCUS_HOME/trust/adapter-keys.toml  # locus adapter trust add --id root --ed25519-pub <b64>
#   LOCUS_ADAPTER_TRUST_KEYS=id:ed25519:<base64-pubkey>[,id:hmac-sha256:<64-hex>]
# Built-in entries ship unsigned until a registry root is published.
# `locus adapter verify --require-signed` is fail-closed when any entry is unsigned.

version = 1

[[providers]]
id = "supabase"
name = "Supabase"
status = "built-in"
synthetic = true
capabilities = ["scope", "identity", "destructive_stubs"]
frozen_selectors = ["project_ref", "read_only"]
tools = ["supabase.scope", "supabase.project_ref", "supabase.table.delete"]
destructive_tools = ["supabase.table.delete"]
description = "Frozen project_ref identity tools; synthetic table.delete stub for policy/approval tests."

[[providers]]
id = "github"
name = "GitHub"
status = "built-in"
synthetic = true
capabilities = ["scope", "identity", "repo_allowlist"]
frozen_selectors = ["orgs", "repos"]
tools = ["github.scope", "github.whoami", "github.check_repo"]
destructive_tools = []
description = "Org/repo allowlist freeze; check_repo validates model-supplied full_name against binding scope."

[[providers]]
id = "vercel"
name = "Vercel"
status = "built-in"
synthetic = true
capabilities = ["scope", "identity", "destructive_stubs", "env_allowlist"]
frozen_selectors = ["team_id", "projects", "env"]
tools = ["vercel.scope", "vercel.deploy.prod"]
destructive_tools = ["vercel.deploy.prod"]
description = "team_id + env target freeze; synthetic prod deploy stub."

[[providers]]
id = "cloudflare"
name = "Cloudflare"
status = "built-in"
synthetic = true
capabilities = ["scope", "identity"]
frozen_selectors = ["account_id", "zones"]
tools = ["cloudflare.scope", "cloudflare.whoami"]
destructive_tools = []
description = "account_id freeze; optional zones via scope.projects or scope.extra.zones."

[[providers]]
id = "aws"
name = "AWS"
status = "built-in"
synthetic = true
capabilities = ["scope", "identity", "cli_isolation"]
frozen_selectors = ["account_id", "profile", "region", "role_arn"]
tools = ["aws.scope", "aws.whoami"]
destructive_tools = []
description = "account_id / profile / region freeze; private AWS config dir under session worker home."

[[providers]]
id = "stripe"
name = "Stripe"
status = "built-in"
synthetic = true
capabilities = ["scope", "identity"]
frozen_selectors = ["account_id", "livemode"]
tools = ["stripe.scope", "stripe.whoami"]
destructive_tools = []
description = "account_id + livemode freeze (test vs live)."

[[providers]]
id = "resend"
name = "Resend"
status = "built-in"
synthetic = true
capabilities = ["scope", "identity", "domain_allowlist"]
frozen_selectors = ["domains"]
tools = ["resend.scope", "resend.whoami"]
destructive_tools = []
description = "Domain allowlist freeze (scope.projects or scope.extra.domains)."
