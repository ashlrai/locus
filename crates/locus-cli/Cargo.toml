[package]
name = "locus-cli"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Locus CLI — pin, whoami, exec, binding management"
authors.workspace = true
repository.workspace = true

[[bin]]
name = "locus"
path = "src/main.rs"

[[bin]]
name = "locus-mcp"
path = "src/mcp.rs"

[dependencies]
locus-core = { workspace = true }
libc = { workspace = true }
locus-mcp = { path = "../locus-mcp", version = "0.6.0" }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
colored = { workspace = true }
dirs = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
# Format-preserving TOML edits for Codex config merges (already a transitive
# dep via `toml` 0.8, so this adds no new lockfile entries).
toml_edit = "0.22"

[dev-dependencies]
sha2 = { workspace = true }
toml = { workspace = true }
tower = { workspace = true, features = ["util"] }

# Shared phantom+locus merge-queue test; skips when PHANTOM_BIN is unset.
[[test]]
name = "phantom_locus"
path = "../../tests/integration/phantom_locus.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "packaged_binaries"
path = "tests/packaged_binaries.rs"
