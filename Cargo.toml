[workspace]
members = [
    "crates/locus-core",
    "crates/locus-cli",
    "crates/locus-mcp",
]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
# MSRV for the locked workspace; verify it using the commands in CONTRIBUTING.md.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ashlrai/locus"
homepage = "https://github.com/ashlrai/locus"
description = "Identity plane for coding agents — wrong account, impossible. Pin multi-account MCP/CLI bindings so agents never act in the wrong tenant."
authors = ["Mason Wyatt <mason@ashlr.ai>"]
readme = "README.md"

[workspace.dependencies]
locus-core = { path = "crates/locus-core", version = "0.6.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "color"] }
clap_complete = "4"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
dirs = "6"
colored = "3"
tempfile = "3"
proptest = "1.6"
jsonschema = { version = "0.29", default-features = false }
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

# Optimize crypto/property-test dependency crates even in dev/test builds.
# Argon2id/blake2/sha2/ed25519 at opt-level 0 are 20-100x slower, and the test
# suites exercise them with production parameters. Same code, same params,
# same assertions -- only the dependency crates are compiled optimized.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
